mod_description=Weapons Of Harmony is a mod that ads unique weapons and movesets to minecraft using Epic Fight Mod!\n\nCredits:\nSome of the weapons in this mod uses voxelized versions CC Attribution models from the site https://sketchfab.com and so deserve attribution for amazing model's I could never make myself :D!\n\n1. The credits for the new Shotogatana model, and it's Sheath goes to 'Shadow Models 3D' On SketchFab - ( https://sketchfab.com/3d-models/katana-ad32e4fbf17149969c9e295d02b7a69a ).\n\n2. The credits for the new Arbiters Blade model goes to 'Quiznos323' On SketchFab - ( https://sketchfab.com/3d-models/the-master-sword-the-legend-of-zelda-6184afc13a304ec18d4c61a76c81e775 ).\n\n3. The credits for the new Arbiters Sheath model goes to 'arnaud.sgz' On SketchFab - ( https://sketchfab.com/3d-models/hylian-shield-and-master-sword-44fbf95b67e24be88aeec1cee8b8f529 ).\n\n4. The credits for the new Arbiters Shield model goes to 'GroundZero' On SketchFab - ( https://sketchfab.com/3d-models/hylian-shield-skyward-sword-42803e468e4142e7bf775b75c92fce65 ).\n\n5. The credits for the new Tsume Model goes to 'Spherveli' On SketchFab - ( https://sketchfab.com/3d-models/dravens-claw-9f3be8723511410fbed91ad59e54ddad ).\n\n6. The credits for the Tenrai's model goes to 'alaeTR' On SketchFab - ( https://sketchfab.com/3d-models/kinzoku-tenrai-baaa1c3d8322479a9f770c8135e4c8ff ).\n\nLastly, the website I used to turn these regular models into voxelized versions to fit mc is - https://www.drububu.com/miscellaneous/voxelizer/index.html\n\nEnjoy :D\nCheers!